apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-jaxrs-liquibase-graphql-api
  namespace: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-jaxrs-liquibase-graphql-api
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
