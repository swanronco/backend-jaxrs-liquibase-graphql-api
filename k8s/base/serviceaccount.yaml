apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-jaxrs-liquibase-graphql-api
  namespace: backend
# Pour l'instant, l'application n'a pas besoin de communiquer avec l'API Kubernetes
# (elle dialogue uniquement avec PostgreSQL). On désactive donc l'injection
# automatique du token du ServiceAccount dans les pods, pour des raisons de sécurité :
# pas de token d'accès au cluster monté dans le conteneur = surface d'attaque réduite.
# Le jour où l'app devra appeler l'API K8s (ex. lire une ConfigMap), repasser à true.
automountServiceAccountToken: false
